<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Uninvited</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #11151f; color: #ffe3a6; font-family: sans-serif; }
    #game { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; padding: 24px; text-align: center; background: #11151f; }
    progress { width: 240px; max-width: 80vw; height: 16px; margin: 20px auto; accent-color: #69dab2; }
  </style>
</head>
<body>
  <div id="game"><canvas id="unity-canvas" tabindex="0" aria-label="Uninvited: wave defense game"></canvas></div>
  <div id="loading"><h1>UNINVITED</h1><p>Preparing the party…</p><progress id="progress" max="1" value="0"></progress><p id="error" role="alert"></p></div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    // Follow the visible viewport when browser bars change size or the device
    // rotates. Safe-area padding remains inside the game container.
    function fitViewport() {
      const viewport = window.visualViewport;
      for (const id of ['game', 'loading']) {
        const element = document.getElementById(id);
        element.style.left = (viewport ? viewport.offsetLeft : 0) + 'px';
        element.style.top = (viewport ? viewport.offsetTop : 0) + 'px';
        element.style.width = (viewport ? viewport.width : window.innerWidth) + 'px';
        element.style.height = (viewport ? viewport.height : window.innerHeight) + 'px';
        element.style.right = element.style.bottom = 'auto';
      }
    }
    fitViewport();
    window.addEventListener('resize', fitViewport);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', fitViewport);
      window.visualViewport.addEventListener('scroll', fitViewport);
    }
    let game;
    createUnityInstance(canvas, {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    }, value => document.getElementById('progress').value = value).then(instance => {
      game = instance;
      document.getElementById('loading').style.display = 'none';
      canvas.focus();
    }).catch(error => { document.getElementById('error').textContent = 'Could not open the party: ' + error; });
    function pauseGame() { if (game) game.SendMessage('Uninvited Game', 'HandleBrowserFocusLost'); }
    window.addEventListener('blur', pauseGame);
    document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
    canvas.addEventListener('contextmenu', event => event.preventDefault());
  </script>
</body>
</html>
